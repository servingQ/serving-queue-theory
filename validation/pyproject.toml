[project]
name = "validation"
version = "0.1.0"
description = "Paper validation and report generation using the seQ simulation engine"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation"]

# The seQ release this repository runs (scripts/fetch_seq.sh reads it).
[tool.seq]
tag = "v0.1.0-rc5"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["checks: the named validation checks (slow; the report runs them too)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
