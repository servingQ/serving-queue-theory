[project]
name = "validation"
version = "0.1.0"
description = "Paper validation and report generation using the serQ simulation engine"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "pyserq==0.1.4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the layers sit in src/ (`from theory.dist import ...`, `from sim import serq`,
# `import checks`, `python -m report.validation`)
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# The serQ this repository runs: pyserq from PyPI (above) and the checkout
# scripts/fetch_serq.sh makes of `tag` (or of `rev`, which wins), for the
# example programs, the oracle IR files and the CLI. `tests/test_units.py`
# holds the two to one version (pyserq's and the checkout's Cargo.toml).
[tool.serq]
tag = "v0.1.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["checks: the named validation checks (slow; the report runs them too)"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
