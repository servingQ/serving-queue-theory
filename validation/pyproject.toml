[project]
name = "validation"
version = "0.1.0"
description = "Paper validation and report generation using the serQ simulation engine"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "pyserq"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the layers sit in src/ (`from theory.dist import ...`, `from sim import serq`,
# `import checks`, `python -m report.validation`)
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# pyserq is built from the serQ checkout scripts/fetch_serq.sh makes (the
# release pinned below), with serQ's own Rust toolchain
[tool.uv.sources]
pyserq = { path = "../.serq/src/pyserq" }

# The serQ release this repository runs (scripts/fetch_serq.sh reads it).
[tool.serq]
tag = "v0.1.0-rc8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["checks: the named validation checks (slow; the report runs them too)"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
