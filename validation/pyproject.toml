[project]
name = "validation"
version = "0.1.0"
description = "Paper validation and report generation using the seQ simulation engine"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation"]

# The serQ release this repository runs (scripts/fetch_seq.sh reads it).
# A commit of serQ's main until v0.1.0-rc6 is tagged: IR 8 and the serQ
# rename (serq CLI, .sq programs) are not in a release yet.
[tool.seq]
rev = "b15444a3bcda7494a5f956b7b45336f0db48071c"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["checks: the named validation checks (slow; the report runs them too)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
