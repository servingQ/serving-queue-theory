name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/seq-access
        with:
          deploy-key: ${{ secrets.SEQ_DEPLOY_KEY }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Mathlib oleans
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build, sorry check, axiom audit
        run: scripts/check_lean.sh
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-axiom-audit
          path: |
            lean/axioms.log
            lean/build.log

  refs:
    name: Paper-Lean refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_lean_refs.sh

  paper:
    name: Paper PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tectonic
        run: |
          curl -sSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin tectonic
          tectonic --version
      - name: Compile
        working-directory: paper
        run: tectonic -X compile main.tex --keep-logs
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf

  sim:
    name: Simulator (libqueuingsim)
    # Pinned to the glibc the paper tables were generated with: a last-bit
    # difference in libm `ln` can change a simulated trajectory.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/seq-access
        with:
          deploy-key: ${{ secrets.SEQ_DEPLOY_KEY }}
      - name: Install pinned Rust toolchain (libqueuingsim/rust-toolchain.toml)
        working-directory: libqueuingsim
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libqueuingsim
      - name: Install uv (scripts/plot_sim.py draws the figures)
        uses: astral-sh/setup-uv@v6
      - name: Lean names, fmt, clippy, tests, validation report, tables and figures
        run: scripts/check_sim.sh
      - name: Publish report to job summary
        if: always()
        run: cat libqueuingsim/validation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-validation-report
          path: libqueuingsim/validation-report.md

