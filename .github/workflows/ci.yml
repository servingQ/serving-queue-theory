name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Which jobs a change needs. The simulator job runs simulator checks and
  # regenerates the validation report, so it runs only
  # when something it reads changed: the package, the seQ programs it runs, the
  # E1 calibration, the Lean names it checks, its scripts, or the
  # workflow itself. A manual run (workflow_dispatch) runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sim: ${{ steps.filter.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sim:
              - validation/**
              - programs/**
              - data/exp/e1/**
              - lean/**
              - scripts/check_sim.sh
              - scripts/fetch_seq.sh
              - .github/workflows/ci.yml
              - .github/actions/**

  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/seq-access
        with:
          deploy-key: ${{ secrets.SEQ_DEPLOY_KEY }}
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Mathlib oleans
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build, sorry check, axiom audit
        run: scripts/check_lean.sh
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-axiom-audit
          path: |
            lean/axioms.log
            lean/build.log

  refs:
    name: Paper-Lean refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_lean_refs.sh

  paper:
    name: Paper PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tectonic
        run: |
          curl -sSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin tectonic
          tectonic --version
      - name: Compile
        working-directory: paper
        run: tectonic -X compile main.tex --keep-logs
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf

  sim:
    name: Paper validation (seQ)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sim == 'true'
    # Pinned to the glibc the paper tables were generated with: a last-bit
    # difference in libm `ln` can change a simulated trajectory.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/seq-access
        with:
          deploy-key: ${{ secrets.SEQ_DEPLOY_KEY }}
      # The seQ CLI is built from the pinned release with seQ's own Rust
      # toolchain; cache it by the pin.
      - uses: actions/cache@v4
        with:
          path: .seq
          key: seq-${{ runner.os }}-${{ hashFiles('validation/pyproject.toml') }}
      - name: seQ CLI (the release pinned in validation/pyproject.toml)
        run: scripts/fetch_seq.sh
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: validation
      - name: Python environment
        working-directory: validation
        run: uv sync --locked
      - name: Lean names, ruff, pytest and validation report
        run: scripts/check_sim.sh
      - name: Publish report to job summary
        if: always()
        run: cat validation/validation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-validation-report
          path: validation/validation-report.md
