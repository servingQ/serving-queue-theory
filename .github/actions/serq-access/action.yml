name: Access serQ
description: >
  Read access to the private serQ repository (scripts/fetch_serq.sh checks out
  the release pinned in validation/pyproject.toml, whose example programs
  the validation package runs and whose IR files the Lean oracle check reads) through a
  read-only deploy key.
inputs:
  deploy-key:
    description: private half of the read-only deploy key on vrvrv/serQ (secret SERQ_DEPLOY_KEY)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.deploy-key }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::serQ deploy key is not set (see research/serq.md)"; exit 1
        fi
        mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/serq && chmod 600 ~/.ssh/serq
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        git config --global core.sshCommand "ssh -i ~/.ssh/serq -o IdentitiesOnly=yes"
        git config --global url."git@github.com:vrvrv/serQ".insteadOf "https://github.com/vrvrv/serQ"
