name: Access seQ
description: >
  Read access to the private seQ repository (a pinned release is a Cargo
  git dependency of paper-validation; scripts/fetch_seq.sh checks it out for
  the Lean oracle check) through a read-only deploy key, for git and Cargo
  (git-fetch-with-cli).
inputs:
  deploy-key:
    description: private half of the read-only deploy key on vrvrv/seQ (secret SEQ_DEPLOY_KEY)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.deploy-key }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::secret SEQ_DEPLOY_KEY is not set (see research/seq.md)"; exit 1
        fi
        mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/seq && chmod 600 ~/.ssh/seq
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        git config --global core.sshCommand "ssh -i ~/.ssh/seq -o IdentitiesOnly=yes"
        git config --global url."git@github.com:vrvrv/seQ".insteadOf "https://github.com/vrvrv/seQ"
