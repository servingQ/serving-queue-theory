[package]
name = "libqueuingsim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Discrete-event simulator that tests the serving-queue-theory propositions outside their assumptions"
publish = false

[dependencies]
rand = "0.9"
# ROUTE, the serving-deployment language: the validation checks run its
# programs next to the hand-written models (docs/route-language.md).
route = { path = "../route" }

# Statistical tests simulate millions of customers; run them optimised.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
