[package]
name = "libqueuingsim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Discrete-event simulator that tests the serving-queue-theory propositions outside their assumptions"
publish = false

[dependencies]
rand = "0.9"
# seQ, the serving-deployment language (a pinned release; scripts/fetch_seq.sh
# checks out the same tag): the validation checks run its programs next to
# the hand-written models.
seq = { package = "seq-lang", git = "https://github.com/vrvrv/seQ", tag = "v0.1.0-rc1" }

# Statistical tests simulate millions of customers; run them optimised.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
