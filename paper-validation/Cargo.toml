[package]
name = "paper-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Paper validation and report generation using the seQ simulation engine"
publish = false

[dependencies]
rand = "0.9"
# seQ defines and executes the serving deployments and provides shared distributions.
seq = { package = "seq-lang", git = "https://github.com/vrvrv/seQ", tag = "v0.1.0-rc4" }

# Statistical tests simulate millions of customers; run them optimised.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
